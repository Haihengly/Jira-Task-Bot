services:
  bot:
    build: .
    container_name: jira-telegram-bot
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - ./bot-data:/app/data

  ngrok:
    image: ngrok/ngrok:latest
    command: http bot:3000
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    ports:
      - "4040:4040"
    depends_on:
      - bot