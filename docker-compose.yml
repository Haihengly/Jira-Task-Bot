services:
  bot:
    build:
      context: ./bot
      dockerfile: ../Dockerfile.bot
    container_name: jira-telegram-bot
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - ./bot-data:/app/data

  cron-service:
    build:
      context: ./cron-service
      dockerfile: ../Dockerfile.cron-service
    container_name: jira-telegram-cron-service
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./bot-data:/app/data:ro
    depends_on:
      - bot

  ngrok:
    image: ngrok/ngrok:latest
    command: http bot:3000
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    ports:
      - "4040:4040"
    depends_on:
      - bot