services:
  bot:
    build:
      context: ./bot
      dockerfile: ../Dockerfile.bot
    container_name: jira-telegram-bot
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3030:3030"
    volumes:
      - ./bot-data:/app/data

  cron-service:
    build:
      context: ./cron-service
      dockerfile: ../Dockerfile.cron-service
    container_name: jira-telegram-cron-service
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./bot-data:/app/data:ro
    depends_on:
      - bot

  # set up a reverse proxy to expose the bot service to the internet
  # cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   volumes:
  #     - ~/.cloudflared:/home/nonroot/.cloudflared
  #   restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    volumes:
      - ~/.cloudflared:/home/nonroot/.cloudflared
      - ./config.yml:/home/nonroot/.cloudflared/config.yml
    command: tunnel run jira-bot
    restart: unless-stopped
    depends_on:
      - bot